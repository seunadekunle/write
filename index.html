<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Write</title>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <style>
    :root {
      --bg-primary: #0d1117;
      --bg-secondary: #161b22;
      --text-primary: #e6edf3;
      --text-muted: #7d8590;
      --border: #30363d;
      --accent: #58a6ff;
      --code-bg: #1f2428;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--bg-primary);
    }

    .container {
      display: flex;
      height: 100vh;
    }

    #editor {
      flex: 1;
      padding: 2rem;
      background: var(--bg-primary);
      color: var(--text-primary);
      border: none;
      border-right: 1px solid var(--border);
      resize: none;
      outline: none;
      font-family: 'SF Mono', 'Fira Code', 'Monaco', 'Consolas', monospace;
      font-size: 14px;
      line-height: 1.6;
      overflow-y: auto;
    }

    #editor::placeholder {
      color: var(--text-muted);
    }

    #preview {
      flex: 1;
      padding: 2rem;
      background: var(--bg-secondary);
      color: var(--text-primary);
      overflow-y: auto;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.7;
    }

    #preview h1, #preview h2, #preview h3, #preview h4, #preview h5, #preview h6 {
      margin-top: 1.5em;
      margin-bottom: 0.5em;
      font-weight: 600;
      line-height: 1.25;
    }

    #preview h1 { font-size: 2em; border-bottom: 1px solid var(--border); padding-bottom: 0.3em; }
    #preview h2 { font-size: 1.5em; border-bottom: 1px solid var(--border); padding-bottom: 0.3em; }
    #preview h3 { font-size: 1.25em; }

    #preview p {
      margin-bottom: 1em;
    }

    #preview code {
      background: var(--code-bg);
      padding: 0.2em 0.4em;
      border-radius: 4px;
      font-family: 'SF Mono', 'Fira Code', 'Monaco', 'Consolas', monospace;
      font-size: 0.9em;
    }

    #preview pre {
      background: var(--code-bg);
      padding: 1rem;
      border-radius: 6px;
      overflow-x: auto;
      margin-bottom: 1em;
    }

    #preview pre code {
      background: none;
      padding: 0;
    }

    #preview ul, #preview ol {
      margin-bottom: 1em;
      padding-left: 2em;
    }

    #preview li {
      margin-bottom: 0.25em;
    }

    #preview blockquote {
      border-left: 4px solid var(--accent);
      padding-left: 1em;
      margin-left: 0;
      margin-bottom: 1em;
      color: var(--text-muted);
    }

    #preview a {
      color: var(--accent);
      text-decoration: none;
    }

    #preview a:hover {
      text-decoration: underline;
    }

    #preview hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 1.5em 0;
    }

    #preview table {
      border-collapse: collapse;
      margin-bottom: 1em;
      width: 100%;
    }

    #preview th, #preview td {
      border: 1px solid var(--border);
      padding: 0.5em 1em;
      text-align: left;
    }

    #preview th {
      background: var(--code-bg);
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }

      #editor {
        border-right: none;
        border-bottom: 1px solid var(--border);
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <textarea id="editor" placeholder="Start writing your prompt..." autofocus></textarea>
    <article id="preview"></article>
  </main>

  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/marked/15.0.4/marked.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.3/purify.min.js"></script>
  <script>
    (function() {
      'use strict';

      const STORAGE_KEY = 'write_content';
      const DEBOUNCE_MS = 150;
      let debounceTimer = null;

      function init() {
        const editor = document.getElementById('editor');
        const preview = document.getElementById('preview');

        // Configure marked
        marked.setOptions({
          gfm: true,
          breaks: true
        });

        // Render markdown
        function render() {
          const html = marked.parse(editor.value);
          preview.innerHTML = DOMPurify.sanitize(html);
        }

        // Debounced handler
        function handleInput() {
          clearTimeout(debounceTimer);
          debounceTimer = setTimeout(() => {
            render();
            localStorage.setItem(STORAGE_KEY, editor.value);
          }, DEBOUNCE_MS);
        }

        // Tab key support
        editor.addEventListener('keydown', (e) => {
          if (e.key === 'Tab') {
            e.preventDefault();
            const start = editor.selectionStart;
            const end = editor.selectionEnd;
            editor.value = editor.value.substring(0, start) + '  ' + editor.value.substring(end);
            editor.selectionStart = editor.selectionEnd = start + 2;
            handleInput();
          }
        });

        // Input handler
        editor.addEventListener('input', handleInput);

        // Load saved content
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          editor.value = saved;
        }
        render();
      }

      // Wait for libraries to load
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => setTimeout(init, 50));
      } else {
        setTimeout(init, 50);
      }
    })();
  </script>
</body>
</html>
